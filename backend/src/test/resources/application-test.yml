spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartedtech_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:smartedtech_user}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_BEFORE_RUNNING}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  file-storage:
    path: ./build/test-uploads
  jwt:
    secret: ${JWT_SECRET:test_secret_key_must_be_at_least_32_bytes_long_for_security_checks_12345}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
  bootstrap-admin:
    email: admin@smartedtech.com
    password: AdminSecurePassword123!
  integrations:
    gemini:
      api-key:
      model: gemini-1.5-flash
    groq:
      api-key:
      model: llama-3.3-70b-versatile
    jitsi:
      app-id:
      kid:
      private-key-path:
